<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="editor-container">
        <div id="text-view">Це початковий текст, який можна відредагувати. Натисніть Ctrl + E для переходу в режим
            редагування.</div>
        <textarea id="text-edit" hidden></textarea>
        <div class="info-block">
            Підказка: <strong>Ctrl + E</strong> — редагувати, <strong>Ctrl + S</strong> — зберегти.
        </div>
    </div>

    <table id="sortable-table">
        <thead>
            <tr>
                <th data-type="number">ID</th>
                <th data-type="string">Ім'я</th>
                <th data-type="number">Вік</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>3</td>
                <td>Олена</td>
                <td>22</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Іван</td>
                <td>35</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Марія</td>
                <td>19</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Петро</td>
                <td>28</td>
            </tr>
        </tbody>
    </table>

    <div class="resizable-box" id="resizable">
        <p> Затисніть мишкою правий нижній кут і тягніть, щоб
            змінити розмір цього блоку.</p>
        <div class="resizer" id="resizer"></div>
    </div>

    <script src="main.js"></script>
</body>

</html>
